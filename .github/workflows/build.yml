name: Build

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    name: Windows ${{ matrix.arch }} ${{ matrix.preset }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
        arch: [x64, arm64]
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run HelloWorld
        shell: pwsh
        run: |
          $executable = ".\build\${{ matrix.preset }}\samples\HelloWorld\PhotinoX.Cpp.HelloWorld.exe"

          if (-not (Test-Path $executable)) {
            throw "Executable not found: $executable"
          }

          & $executable

          if ($LASTEXITCODE -ne 0) {
            throw "HelloWorld failed with exit code $LASTEXITCODE."
          }

  build-linux:
    name: Linux ${{ matrix.arch }} ${{ matrix.preset }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
        arch: [x64, arm64]
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libnotify-dev

      - name: Configure
        run: cmake --preset "${{ matrix.preset }}"

      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}"

      - name: Run HelloWorld
        run: |
          executable="./build/${{ matrix.preset }}/samples/HelloWorld/PhotinoX.Cpp.HelloWorld"

          if [ ! -x "$executable" ]; then
            echo "Executable not found: $executable"
            exit 1
          fi

          "$executable"

  build-macos:
    name: macOS ${{ matrix.arch }} ${{ matrix.preset }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
        arch: [x64, arm64]
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: cmake --preset "${{ matrix.preset }}"

      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}"

      - name: Run HelloWorld
        run: |
          executable="./build/${{ matrix.preset }}/samples/HelloWorld/PhotinoX.Cpp.HelloWorld"

          if [ ! -x "$executable" ]; then
            echo "Executable not found: $executable"
            exit 1
          fi

          "$executable"